<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DeepSeek</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="theme-glass">

<!-- ========== MAIN PANEL ========== -->
<div id="mainPanel">
<div id="app">

  <!-- Title -->
  <div class="titlebar">
    <div class="titlebar-left">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
      DeepSeek
    </div>
    <div class="titlebar-actions">
      <button id="btnRefresh" title="刷新">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
      </button>
      <button id="btnSettings" title="设置">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 1v2m0 18v2M4.22 4.22l1.42 1.42m12.72 12.72 1.42 1.42M1 12h2m18 0h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
      </button>
      <button id="btnClose" class="close-btn" title="隐藏">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
  </div>

  <!-- Overview: balance + daily/monthly merged -->
  <div class="card">
    <div class="card-header">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"/><path d="M3 5v14a2 2 0 0 0 2 2h16v-5"/><path d="M18 12a2 2 0 0 0 0 4h4v-4Z"/></svg>
      账户概览
    </div>
    <div class="overview-main">
      <div class="overview-balance" id="balanceValue">--</div>
      <div class="overview-stats">
        <div class="stat">
          <div class="stat-label">当日消耗</div>
          <div class="stat-value" id="dailyCost">--</div>
        </div>
        <div class="stat">
          <div class="stat-label">本月消耗</div>
          <div class="stat-value" id="monthlyCost">--</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Model cards -->
  <div id="modelCards"></div>

  <!-- Chart -->
  <div class="card">
    <div class="card-header">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>
      <span id="chartTitle">近七天用量</span>
      <div class="chart-toggle">
        <button class="chart-tg ctg active" data-mode="week">周</button>
        <button class="chart-tg ctg" data-mode="month">月</button>
      </div>
    </div>
    <div class="chart-wrap"><canvas id="chartCanvas"></canvas></div>
  </div>

</div>
</div>
</div>

<!-- ========== SETTINGS PANEL ========== -->
<div id="settingsPanel" style="display:none;">
<div id="app">

  <div class="titlebar">
    <div class="titlebar-left">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 1v2m0 18v2M4.22 4.22l1.42 1.42m12.72 12.72 1.42 1.42M1 12h2m18 0h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
      设置
    </div>
    <div class="titlebar-actions">
      <button id="btnBack" title="返回">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
  </div>

  <div class="settings-page">
    <div class="form-group">
      <label>界面主题</label>
      <div class="theme-options">
        <div class="theme-opt active" data-theme="glass" id="optGlass">
          <div class="preview preview-glass"></div>毛玻璃
        </div>
        <div class="theme-opt" data-theme="tech" id="optTech">
          <div class="preview preview-tech"></div>科技风
        </div>
        <div class="theme-opt" data-theme="geek" id="optGeek">
          <div class="preview preview-geek"></div>极客
        </div>
        <div class="theme-opt" data-theme="cute" id="optCute">
          <div class="preview preview-cute"></div>可爱
        </div>
        <div class="theme-opt" data-theme="minimal" id="optMinimal">
          <div class="preview preview-minimal"></div>简约
        </div>
      </div>
    </div>

    <div class="form-group">
      <label>平台 Token</label>
      <div class="api-key-row">
        <input type="password" id="platformToken" placeholder="Bearer eyJ..." autocomplete="off">
        <button class="btn btn-secondary btn-sm" id="btnToggleKey">显示</button>
      </div>
    </div>

    <div class="form-group">
      <label>平台 Cookie（通过 WAF 验证）</label>
      <input type="password" id="platformCookie" placeholder="smidV2=...; HWWAFSESID=...; HWWAFSESTIME=..." autocomplete="off">
      <div class="api-key-row" style="margin-top:6px;">
        <button class="btn btn-primary btn-sm btn-block" id="btnTestKey">测试连接</button>
      </div>
      <div id="keyStatus" style="margin-top:5px;"></div>
      <div style="font-size:10px;color:var(--text3);margin-top:4px;">
        F12 → Network → 选任意 API 请求 → 复制 Authorization 和 Cookie 两个值
      </div>
    </div>

    <div class="form-group">
      <label>刷新间隔</label>
      <select id="refreshInterval">
        <option value="5">5 分钟</option>
        <option value="10" selected>10 分钟</option>
        <option value="15">15 分钟</option>
        <option value="30">30 分钟</option>
        <option value="60">60 分钟</option>
      </select>
    </div>

    <div class="form-group">
      <div class="toggle-row">
        <span class="toggle-label">开机自启</span>
        <div class="toggle-switch" id="toggleAutoStart"></div>
      </div>
    </div>

    <div class="form-group">
      <div class="toggle-row">
        <span class="toggle-label">用量预警</span>
        <div class="toggle-switch" id="toggleAlert"></div>
      </div>
    </div>

    <div class="form-group" id="alertSettings" style="display:none;">
      <label>余额预警阈值 (￥)</label>
      <input type="number" id="alertBalance" placeholder="10.00" step="0.01" min="0">
      <label style="margin-top:8px;">日消耗预警阈值 (￥)</label>
      <input type="number" id="alertDaily" placeholder="50.00" step="0.01" min="0">
    </div>

    <div class="form-group">
      <label>显示模型</label>
      <label class="checkbox-row"><input type="checkbox" id="modelFlash" checked><span>V4 Flash</span></label>
      <label class="checkbox-row"><input type="checkbox" id="modelPro" checked><span>V4 Pro</span></label>
    </div>

    <div class="btn-row">
      <button class="btn btn-primary btn-block" id="btnSave">保存设置</button>
    </div>
    <div id="saveStatus" style="text-align:center;margin-top:8px;"></div>
  </div>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="js/app.js"></script>
</body>
</html>
